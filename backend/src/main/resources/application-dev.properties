spring.datasource.url=jdbc:h2:mem:luxemart;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# The MySQL migration scripts are not portable to H2; the dev schema comes from the entities.
spring.flyway.enabled=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT: dev-only fallback so the app runs out of the box. Production MUST set JWT_SECRET.
jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-secret-please-change-in-production-0123456789abcdef}

# Dev runs on http://localhost, where a Secure cookie would be dropped by some browsers.
app.security.refresh-cookie.secure=false