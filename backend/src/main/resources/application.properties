server.port=8080
spring.application.name=luxemart-api

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/luxemart_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# No fallback here on purpose: JwtService refuses to start without a JWT_SECRET of at least 32 bytes.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000

# Commerce rules (checkout pricing + storefront badges)
app.commerce.free-shipping-threshold=150.00
app.commerce.shipping-cost=9.90
app.commerce.tax-rate=0.20
app.commerce.low-stock-threshold=5

# Brute-force protection on POST /api/auth/login, keyed by client IP
app.security.login-rate-limit.requests-per-window=10
app.security.login-rate-limit.window-seconds=60

# Read X-Forwarded-* so the client IP is correct behind nginx (see frontend/nginx.conf)
server.forward-headers-strategy=framework

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Observability: only the health probe is exposed over HTTP
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true


