# Profile used only by MySqlSchemaMigrationIT, against a real MySQL 8. Everything else — Flyway
# enabled, ddl-auto=validate, MySQL dialect — is inherited from application.properties.
# No fallback values on purpose: the test is skipped unless MYSQL_IT is set with the TEST_DB_* ones.
spring.datasource.url=${TEST_DB_URL}
spring.datasource.username=${TEST_DB_USERNAME}
spring.datasource.password=${TEST_DB_PASSWORD}
jwt.secret=${JWT_SECRET:mysql-it-placeholder-secret-value-32-chars}
